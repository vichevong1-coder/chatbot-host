name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - staging
      - feat/*
      - fix/*
      - sovandeth
  pull_request:
    branches:
      - main
      - master
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Syntax Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint-and-format
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    env:
      PYTHONPATH: ${{ github.workspace }}/orchestrator
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock_ci_key' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r orchestrator/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run NLU & Orchestrator Pytest Suite
        run: |
          pytest testing/test_prompt_controller.py \
                 testing/test_nlu_schema.py \
                 testing/test_nlu_normalizer.py \
                 testing/test_nlu_intent.py \
                 testing/test_nlu_router.py \
                 testing/test_nlu_disambiguation.py \
                 testing/test_nlu_clarify.py \
                 testing/test_nlu_off_topic.py \
                 testing/test_nlu_pipeline.py -v
