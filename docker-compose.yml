services:
  # Frontend UI (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: science-frontend
    ports:
      - "80:80"
    depends_on:
      - orchestrator
    networks:
      - science-network

  # State Checkpointing & Cache (Optimized)
  redis:
    image: redis:7-alpine
    container_name: science-redis
    ports:
      - "6379:6379"
    networks:
      - science-network

  # Persistent Logs Database (Optimized for RAM)
  db:
    image: postgres:15-alpine
    container_name: science-postgres
    restart: always
    command: postgres -c shared_buffers=16MB -c max_connections=20
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-science_chatbot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - science-network

  # Vector DB for Physics & Biology RAG
  qdrant:
    image: qdrant/qdrant:latest
    container_name: science-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - science-network

  # Main API Gateway
  orchestrator:
    build:
      context: ./backend/orchestrator
      dockerfile: Dockerfile
    container_name: science-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-9000}:${ORCHESTRATOR_PORT:-9000}"
    env_file:
      - .env
    depends_on:
      - redis
      - qdrant
      - db
    networks:
      - science-network

  # Math Solver
  math-service:
    build:
      context: ./backend/services/math_service
      dockerfile: Dockerfile
    container_name: math-service
    ports:
      - "${MATH_SERVICE_PORT:-9001}:${MATH_SERVICE_PORT:-9001}"
    env_file:
      - .env
    networks:
      - science-network

  # Unified Science Solver
  science-service:
    build:
      context: ./backend/services/science_service
      dockerfile: Dockerfile
    container_name: science-service
    ports:
      - "${SCIENCE_SERVICE_PORT:-9002}:${SCIENCE_SERVICE_PORT:-9002}"
    env_file:
      - .env
    networks:
      - science-network

  # Homework OCR + VLM Pipeline
  homework-scanner:
    build:
      context: ./backend/homework_ocr_vlm
      dockerfile: Dockerfile
    container_name: homework-scanner
    ports:
      - "${HOMEWORK_SCANNER_PORT:-9003}:9003"
    env_file:
      - .env
    networks:
      - science-network

networks:
  science-network:
    driver: bridge

volumes:
  qdrant_data:
  postgres_data:
